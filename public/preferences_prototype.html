// Seeded RNG for determinism
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Build the 100-card weekly pool
function buildPool(weekSeed){
  const rng = mulberry32(weekSeed);
  const shuffled = [...NAMES].sort(() => rng() - 0.5).slice(0, 100);
  return shuffled.map((row, i) => {
    const [name, ticker, country, sector] = row;
    const strategy = STRATEGIES[Math.floor(rng() * STRATEGIES.length)];
    const stars = Math.max(1, Math.min(5, Math.round(2 + rng() * 3)));
    const mos = Math.round(5 + rng() * 50);
    return {
      id: 'card_' + i,
      name, ticker, country, sector, strategy, stars, mos,
      region: COUNTRY_REGION[country] || 'Other'
    };
  });
}

const EXCL_OPTS = [
  { id:'tobacco',  label:'Tobacco',      sub:'BAT · MO · PM' },
  { id:'gambling', label:'Gambling',     sub:'Casinos · betting' },
  { id:'defence',  label:'Defence',      sub:'Weapons · arms' },
  { id:'oilgas',   label:'Oil & Gas',    sub:'Fossil fuels' },
  { id:'alcohol',  label:'Alcohol',      sub:'Spirits · brewers' },
  { id:'crypto',   label:'Crypto',       sub:'Digital assets' }
];

// Week 19 of 2026 starts Mon May 11
const WEEK_SEED = 20261912;
const POOL = buildPool(WEEK_SEED);

// ── PICKER ─────────────────────────────────────────────────────────────────
function applyFilters(pool, prefs){
  return pool.filter(c => {
    if (!prefs.geo.includes(c.region)) return false;
    if (!prefs.strategy.includes(c.strategy)) return false;
    if (c.stars < prefs.stars) return false;
    if (prefs.exclude.includes(c.sector)) return false;
    return true;
  });
}

function pickToday(){
  const unseen = POOL.filter(c => !state.seenIds.has(c.id));
  const daySeed = WEEK_SEED + state.dayOffset * 17;
  const rng = mulberry32(daySeed);
  const shuffle = (arr) => [...arr].sort(() => rng() - 0.5);

  // FREE pick (any unseen card)
  const freePick = shuffle(unseen)[0] || null;

  // PRO pick
  let proPick = null;
  let noMatch = false;
  let appliedPrefs = state.prefs;
  if (state.isPro){
    const filtered = applyFilters(unseen.filter(c => c.id !== freePick?.id), state.prefs);
    if (filtered.length > 0){
      proPick = shuffle(filtered)[0];
    } else {
      noMatch = true;
    }
  } else {
    // For FREE users, lock a second random card
    proPick = shuffle(unseen.filter(c => c.id !== freePick?.id))[0] || null;
  }

  return { freePick, proPick, noMatch, appliedPrefs };
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function dayLabel(){
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date(2026, 4, 11 + state.dayOffset); // start Mon May 11
  return days[d.getDay()] + ' · ' + d.getDate() + ' ' + months[d.getMonth()] + ' 2026';
}

function render(){
  document.getElementById('dateHeader').textContent = dayLabel();
  document.getElementById('proToggle').textContent = 'Pro mode: ' + (state.isPro ? 'ON' : 'OFF');
  document.getElementById('proToggle').classList.toggle('on', state.isPro);
  document.getElementById('prefsPanel').style.display = state.isPro ? 'block' : 'none';

  renderChips();
  renderCards();
  renderDebug();
}

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  chip(row, 'GEO', geoSummary(),     'geo');
  chip(row, 'STR', strategySummary(),'strategy');
  chip(row, '★',   state.prefs.stars + '+', 'stars');
  chip(row, 'OUT', excludeSummary(), 'exclude');

  const matching = applyFilters(POOL, state.prefs).length;
  document.getElementById('matchCount').textContent = matching;
}

function chip(parent, label, value, key){
  const active = isFilterActive(key);
  const el = document.createElement('div');
  el.className = 'chip ' + (active ? 'active' : 'inactive');
  el.innerHTML = '<span class="chip-label">'+label+'</span><span>'+value+'</span><span class="chip-edit">✎</span>';
  el.onclick = () => openModal(key);
  parent.appendChild(el);
}

function isFilterActive(key){
  if (key === 'geo')      return state.prefs.geo.length < GEO_OPTS.length;
  if (key === 'strategy') return state.prefs.strategy.length < STRAT_OPTS.length;
  if (key === 'stars')    return state.prefs.stars > 1;
  if (key === 'exclude')  return state.prefs.exclude.length > 0;
}
function geoSummary(){
  const n = state.prefs.geo.length;
  if (n === GEO_OPTS.length) return 'All';
  if (n === 0) return 'None';
  if (n === 1) return state.prefs.geo[0];
  return n + ' regions';
}
function strategySummary(){
  const n = state.prefs.strategy.length;
  if (n === STRAT_OPTS.length) return 'All 6';
  if (n === 0) return 'None';
  if (n <= 3) return state.prefs.strategy.join(' ');
  return n + ' of 6';
}
function excludeSummary(){
  const n = state.prefs.exclude.length;
  if (n === 0) return 'None';
  if (n === 1) return EXCL_OPTS.find(o => o.id === state.prefs.exclude[0]).label;
  return n + ' sectors';
}

function renderCards(){
  const grid = document.getElementById('cardGrid');
  const result = pickToday();
  grid.innerHTML = '';

  if (result.freePick){
    grid.appendChild(cardEl(result.freePick, false));
    state.seenIds.add(result.freePick.id);
  }

  if (state.isPro && result.noMatch){
    grid.appendChild(noMatchEl());
  } else if (result.proPick){
    grid.appendChild(cardEl(result.proPick, !state.isPro));
    if (state.isPro) state.seenIds.add(result.proPick.id);
  }
}

function cardEl(c, locked){
  const el = document.createElement('div');
  el.className = 'card' + (locked ? ' pro-locked' : '');
  const tier = locked ? 'tier-pro' : 'tier-free';
  const tierLabel = locked ? 'PRO · LOCKED' : (c.stars >= 4 ? 'PRO' : 'FREE');
  // Force first card to FREE tier badge regardless, second to PRO
  el.innerHTML = `
    <div class="card-head">
      <span class="card-tier ${tier}">${tierLabel}</span>
      <span class="card-strategy">${c.strategy}</span>
    </div>
    <div class="card-name">${c.name}</div>
    <div class="card-meta">${c.ticker} · ${c.country} · ${c.sector === 'tobacco' || c.sector === 'gambling' || c.sector === 'defence' || c.sector === 'oilgas' || c.sector === 'alcohol' || c.sector === 'crypto' ? c.sector.toUpperCase() : c.sector}</div>
    <div class="card-tag">${TAGS[c.strategy]}</div>
    <div class="card-footer">
      <span class="stars">${'★'.repeat(c.stars)}${'☆'.repeat(5-c.stars)}</span>
      <span class="mos ${c.mos < 15 ? 'mos-low' : ''}">MoS ${c.mos}%</span>
    </div>
    ${locked ? '<div class="pro-lock-msg"><div class="lock-icon">🔒</div><div class="lock-text">Pro card</div><div class="lock-sub">Upgrade to unlock today\'s gold pick</div></div>' : ''}
  `;
  return el;
}

function noMatchEl(){
  const newStars = Math.max(1, state.prefs.stars - 1);
  const el = document.createElement('div');
  el.className = 'no-match';
  el.innerHTML = `
    <div class="no-match-title">No match today</div>
    <div class="no-match-sub">Your filters are tight enough that no card in this week's pool matches. The closest available has fewer stars.</div>
    <button class="no-match-btn" onclick="loosenStars()">Loosen stars to ${newStars}★</button>
    <div class="no-match-foot">Or check back tomorrow — new draw daily.</div>
  `;
  return el;
}

function loosenStars(){
  state.prefs.stars = Math.max(1, state.prefs.stars - 1);
  render();
}

function renderDebug(){
  const p = document.getElementById('debugPanel');
  const m = applyFilters(POOL, state.prefs);
  const byStrategy = {};
  POOL.forEach(c => byStrategy[c.strategy] = (byStrategy[c.strategy]||0) + 1);
  p.innerHTML = `
    <div>Pool size: <code>${POOL.length}</code> · Matching prefs: <code>${m.length}</code> · Seen this week: <code>${state.seenIds.size}</code></div>
    <div>By strategy in pool: ${Object.entries(byStrategy).map(([k,v]) => k+':<code>'+v+'</code>').join(' · ')}</div>
    <div>Day offset: <code>${state.dayOffset}</code> (Mon=0)</div>
  `;
}

// ── MODAL ──────────────────────────────────────────────────────────────────
let editingKey = null, draft = null;
function openModal(key){
  editingKey = key;
  draft = key === 'stars' ? state.prefs.stars : JSON.parse(JSON.stringify(state.prefs[key]));
  renderModal();
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); editingKey = null; }
function saveModal(){
  if (editingKey === 'stars') state.prefs.stars = draft;
  else state.prefs[editingKey] = draft;
  closeModal();
  render();
}
function renderModal(){
  const sheet = document.getElementById('modalSheet');
  if (editingKey === 'geo')      sheet.innerHTML = modalMulti('Geography','Which markets do you want to see?', GEO_OPTS, draft);
  if (editingKey === 'strategy') sheet.innerHTML = modalMulti('Strategy Mix','Card types in your daily draw.', STRAT_OPTS, draft);
  if (editingKey === 'exclude')  sheet.innerHTML = modalMulti('Sector Exclusions','Industries you never want to see.', EXCL_OPTS, draft);
  if (editingKey === 'stars')    sheet.innerHTML = modalStars();

  sheet.querySelectorAll('.opt[data-id]').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-id');
      const i = draft.indexOf(id);
      if (i >= 0) draft.splice(i,1); else draft.push(id);
      renderModal();
    };
  });
  sheet.querySelectorAll('.star-btn').forEach(el => {
    el.onclick = () => { draft = parseInt(el.getAttribute('data-stars'),10); renderModal(); };
  });
  sheet.querySelector('[data-act="cancel"]').onclick = closeModal;
  sheet.querySelector('[data-act="save"]').onclick = saveModal;
}
function modalMulti(title, sub, opts, selected){
  return `
    <div class="modal-title">${title}</div>
    <div class="modal-sub">${sub}</div>
    <div class="opt-grid">
      ${opts.map(o => `
        <div class="opt ${selected.includes(o.id) ? 'selected' : ''}" data-id="${o.id}">
          ${o.label}<span class="opt-sub">${o.sub}</span>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" data-act="cancel">Cancel</button>
      <button class="btn-primary"   data-act="save">Save</button>
    </div>
  `;
}
function modalStars(){
  return `
    <div class="modal-title">Minimum Quality</div>
    <div class="modal-sub">Only show cards at this many ValuJack stars or higher.</div>
    <div class="star-row">
      ${[1,2,3,4,5].map(n => `<button class="star-btn ${draft === n ? 'selected' : ''}" data-stars="${n}">${n}★</button>`).join('')}
    </div>
    <p class="star-hint">${
      draft === 1 ? 'Showing every card — broadest selection.' :
      draft === 2 ? 'Excluding the weakest only.' :
      draft === 3 ? 'Solid quality floor. Recommended.' :
      draft === 4 ? 'Strong businesses only.' :
                    'Elite tier — may show very few cards.'
    }</p>
    <div class="modal-actions">
      <button class="btn-secondary" data-act="cancel">Cancel</button>
      <button class="btn-primary"   data-act="save">Save</button>
    </div>
  `;
}
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ── DEMO CONTROLS ─────────────────────────────────────────────────────────
function togglePro(){ state.isPro = !state.isPro; render(); }
function nextDay(){ state.dayOffset = (state.dayOffset + 1) % 7; render(); }
function resetSeen(){ state.seenIds.clear(); render(); }

render();
</script>
</body>
