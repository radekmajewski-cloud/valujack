<script>
const { useState, useEffect } = React;
const CARD_TYPES = {
    KING: { color: '#C0152A', symbol: '♚', corner: 'K', isGold: false, symbolColor: null, cornerColor: null },
    JACK: { color: '#1A1A1A', symbol: '♞', corner: 'J', isGold: false, symbolColor: null, cornerColor: null },
    TWO: { color: '#7A1A1A', symbol: '♠', corner: '2', isGold: false, symbolColor: 'SILVER', cornerColor: '#C8C8C8', symbolSize: '2.1rem' },
    QUEEN: { color: '#4A1A6B', symbol: '♛', corner: 'Q', isGold: true, symbolColor: 'GOLD', cornerColor: '#4A1A6B' },
    ACE: { color: '#4A1A6B', symbol: '♠', corner: 'A', isGold: true, symbolColor: 'GOLD', cornerColor: '#4A1A6B', symbolSize: '3.2rem' },
    JOKER: { color: '#4A1A6B', symbol: '★', corner: '★', isGold: true, symbolColor: 'GOLD', cornerColor: '#4A1A6B' },
};
const SILVER = 'linear-gradient(135deg,#8A8A8A 0%,#C8C8C8 25%,#E0DDDA 45%,#A9A9A9 65%,#D0CDCA 80%,#8A8A8A 100%)';
const GOLD = 'linear-gradient(135deg,#BFA882 0%,#DDBF88 22%,#A88A60 42%,#CAB07A 62%,#8C7858 80%,#C0AA75 100%)';

const cards = window.CARDS_DATA || [];

// Screener universe size, shown in the trust line above the deck.
// UPDATE THIS AT EACH MONTHLY REFRESH (Section 4.2, Stage 1 screening).
const VJ_SCREENED = 15142;

// ── METHODOLOGY: STRATEGY WEIGHTS (Phase 2A) ────────────────────────────────
// Each strategy weights Fundamentals / Context / Price differently.
// Combined weight = (Fundamentals × W_fund) + (Context × W_context) + (Price × W_price)
// Source: ValuJack_Methodology.md (9 May 2026)
const STRATEGY_WEIGHTS = {
    KING:  { fund: 1.5, context: 0.5, price: 1.5 },  // Dividend value — context = falling-knife check
    QUEEN: { fund: 1.5, context: 0.5, price: 2.0 },  // Magic Formula — price-led, context = falling-knife check
    ACE:   { fund: 2.0, context: 1.5, price: 1.0 },  // Piotroski — fundamentals-led, context validates real improvement
    JACK:  { fund: 1.0, context: 2.5, price: 0.0 },  // Minervini — context IS the strategy, price ignored
    JOKER: { fund: 2.0, context: 1.5, price: 0.5 },  // CANSLIM — growth fundamentals + market leadership
    TWO:   { fund: 1.0, context: 2.0, price: 2.5 }   // Contrarian — deep value + recovery context
};

// Fundamentals score (0–10): average of the radar axes EXCLUDING "Fair Price"
function fundamentalsScore(card) {
    if (!card || !card.scores || !Array.isArray(card.scores)) return 5;
    const axes = card.scores.filter(s => s && s.l && s.l !== "Fair Price" && typeof s.v === "number");
    if (axes.length === 0) return 5;
    return axes.reduce((sum, s) => sum + s.v, 0) / axes.length;
}

// Price score (0–10): mapped from current MoS%
function priceScore(mosPercent) {
    if (mosPercent == null || isNaN(mosPercent)) return 0;
    if (mosPercent < 0)  return 0;
    if (mosPercent < 10) return 3;
    if (mosPercent < 20) return 5;
    if (mosPercent < 30) return 7;
    if (mosPercent < 40) return 9;
    return 10;
}

// ── Metric wedges ─────────────────────────────────────────────────────────
// Screener-derived figures are shown as a five-step wedge rather than a
// number. Five steps carry the shape of the value without republishing it.
//
// Each entry is the four cut points between bands 1..5: a value at or above
// cut[0] is band 2, at or above cut[3] is band 5.
const METRIC_SCORE_CUTS = {
    'CANSLIM Leadership':   [6.5, 7.4, 8.2, 9.4],
    'Return on Capital':    [6.4, 7.9, 9.5, 10],
    'Financial Health':     [5.9, 6, 7.8, 8.9],
    'Earnings Growth':      [5, 9.2, 9.7, 10],
    'Cash Generation':      [5.6, 9, 9.5, 10],
    'Profit Quality':       [4.3, 6.1, 9.5, 10],
    'Profitability':        [3.7, 5.1, 8.5, 10],
    'Market Leader':        [8.3, 8.7, 8.9, 9.4],
    'Out of Favour':        [6, 7.4, 8.5, 10],
    'Payout ratio':         [7.8, 7.9, 8, 10],
    'Cash Flow':            [5.4, 8.5, 9.4, 10],
    'Low Debt':             [7.2, 7.8, 8.4, 8.9],
    'Dividend':             [5.3, 5.9, 6.7, 9.1],
    'Strength':             [4, 5.6, 7.6, 10],
    'Quality':              [5.5, 7.2, 8.1, 10],
    'Uptrend':              [5.1, 5.9, 7.7, 9.7],
    'Profit':               [3.4, 4.7, 6.3, 9.2],
    'Value':                [1.8, 5.3, 6.1, 6.5],
};

// The few raw screener percentages still on live cards. Cut points are in the
// metric's own units.
const METRIC_CUTS = {
    'Return on Capital': [10, 18, 28, 45],
    'Profit':            [8, 16, 32, 60],
    'Profitability':     [3, 6, 12, 19],
    'Quality':           [5, 11, 22, 38],
    'Sustained Growth':  [15, 28, 48, 70],
    'Earnings Growth':   [6, 19, 43, 100],
    'Improving Profits': [6, 13, 21, 33],
    'Cash Flow':         [5, 11, 18, 30],
    'Cash Generation':   [18, 23, 31, 48],
    'Profit Quality':    [15, 20, 35, 47],
    'Strength':          [12, 18, 24, 30],
    'Uptrend':           [-8, 2, 12, 25],
    'Dividend':          [2, 3, 6, 10],
    'Dividend Yield':    [2, 3, 6, 10],
    'ROIC':              [10, 18, 28, 45],
    'Payout ratio':      [20, 40, 60, 80],
};

// Metrics where a lower or more negative value earns a fuller wedge.
const METRIC_DESC = {
    // One-year performance, screened at -20% or worse. A deeper fall is more
    // qualifying for a contrarian card, not less.
    'Out of Favour': [-22, -32, -45, -60],
};

// Text-valued metrics, mapped to a band directly.
const METRIC_WORDS = {
    'Price to Book': { Low: 5, Middle: 3, High: 1 },
    'Value':         { Low: 5, Middle: 3, High: 1 },
};

// Labels corrected at display time. cards.js keeps the original values.
const METRIC_RELABEL = {
    'Bottom Reached': 'Uptrend',
    'Dividend Strength': 'Payout ratio',
};

// Dropped at display time: duplicates Earnings Growth and its arithmetic
// penalises companies whose past growth was exceptional.
const METRIC_DROP = { 'Earnings Accelerating': true };

function metricBand(label, raw) {
    if (raw == null) return null;
    const v = String(raw).trim();
    if (!v || v === '\u2014' || v.toUpperCase() === 'N/A') return null;

    const words = METRIC_WORDS[label];
    if (words && words[v] != null) return words[v];

    const frac = v.match(/^(-?[\d.]+)\s*\/\s*(\d+)$/);
    if (frac) {
        let n = parseFloat(frac[1]);
        const d = parseFloat(frac[2]);
        // A "/10" score above 10 is a 0-100 percentile that was mislabelled.
        if (d === 10 && n > 10) n = n / 10; else if (d !== 10) n = n * 10 / d;
        const sc = METRIC_SCORE_CUTS[label];
        if (!sc) return Math.max(1, Math.min(5, Math.ceil(n / 2)));
        let b = 1;
        for (let i = 0; i < sc.length; i++) if (n >= sc[i]) b = i + 2;
        return b;
    }

    const num = v.match(/^([+-]?[\d.]+)\s*%?$/);
    if (!num) return null;
    const n = parseFloat(num[1]);
    if (isNaN(n)) return null;

    const desc = METRIC_DESC[label];
    if (desc) {
        let b = 1;
        for (let i = 0; i < desc.length; i++) if (n <= desc[i]) b = i + 2;
        return b;
    }
    const cuts = METRIC_CUTS[label];
    if (!cuts) return null;
    let b = 1;
    for (let i = 0; i < cuts.length; i++) if (n >= cuts[i]) b = i + 2;
    return b;
}

// Five-step wedge. Band 5 is a filled disc; band 0 never renders.
function wedgePath(cx, cy, r, band) {
    const f = band / 5;
    const a = (-90 + 360 * f) * Math.PI / 180;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    return 'M' + cx + ' ' + cy + ' L' + cx + ' ' + (cy - r) +
           ' A' + r + ' ' + r + ' 0 ' + (f > 0.5 ? 1 : 0) + ' 1 ' +
           x.toFixed(2) + ' ' + y.toFixed(2) + ' Z';
}

function faceBand(label, value) {
    if (!label || value == null) return null;
    const key = String(label).toLowerCase().replace(/\bf-score\b/, 'financial health');
    const match = Object.keys(METRIC_SCORE_CUTS).concat(Object.keys(METRIC_CUTS))
        .find(k => k.toLowerCase() === key);
    if (!match) return null;
    let v = String(value).trim();
    const bare = v.match(/^(-?[\d.]+)$/);
    if (bare && parseFloat(bare[1]) > 10) v = (parseFloat(bare[1]) / 10).toFixed(1) + ' / 10';
    else if (bare) v = bare[1] + ' / 10';
    return metricBand(match, v);
}

function MetricWedge(band, label) {
    if (band == null) {

const AXIS_COLORS = ['#2E7D5A', '#1F7A8C', '#3A5BA8', '#B03A2E', '#A8841C'];

// Score stars coloured by axis, strongest first, so the row reads as a legend
// for the radar: a filled star is a criterion carrying the score.

    const sc = card.scores || [];

    const order = sc.map((x, k) => ({ k, f: x.max ? x.v / x.max : 0 }))
        .sort((a, b) => b.f - a.f);

    return React.createElement("span", { style: { fontSize: size, letterSpacing: '0.1em' } },
        order.map((o, j) => React.createElement("span",
            { key: 'ss' + j, style: { color: AXIS_COLORS[o.k % AXIS_COLORS.length] } },
            j < lit ? '\u2605' : '\u2606')));

// LSE (.L) stocks are quoted in pence (GBX). When Yahoo returns 356 for a £3.56 stock,
// the price needs to be divided by 100. We only correct when the ratio is clearly wrong
// (price > 10x fair value) to avoid touching legitimate prices.

    if (!rawPrice || !card || !card.yahooTicker) return rawPrice;
    if (card.yahooTicker.endsWith('.L') && card.fairValue && rawPrice > card.fairValue * 10) {
        return rawPrice / 100;
    }

    if (!w) return 0;
    const f = fundamentalsScore(card);
    const c = (typeof card.contextScore === "number") ? card.contextScore : 5;
    const p = priceScore(mosPercent);
    return (f * w.fund) + (c * w.context) + (p * w.price);
}

<style>

</style>

<script>
(function(){
  var btnShown = false;

  function anim(id, delay, kf, dur) {
    setTimeout(function(){
      var el = document.getElementById(id);
      if(el) el.style.animation = (kf||'fadeUp') + ' ' + (dur||'0.9s') + ' cubic-bezier(0.22,1,0.36,1) forwards';
    }, delay);
  }

  anim('sl1', 600);
  anim('sl2', 2600);
  anim('sl3', 4600);
  anim('sl4', 5800, 'fadeIn', '0.7s');
  anim('sl5', 6300, 'scaleUp', '1s');
  anim('sl6', 7000, 'fadeIn', '0.8s');
  setTimeout(function(){
    var btn = document.getElementById('splashBtn');
    if(btn){ btn.style.animation = 'fadeIn 0.8s ease forwards'; btnShown = true; }
    var inner = document.getElementById('splashBtnInner');
    setTimeout(function(){ if(inner) inner.style.animation = 'btnPulse 2s ease-in-out infinite'; }, 900);
  }, 7500);



})();

function dismissSplash(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  var s = document.getElementById('splash');
  s.style.animation = 'splashOut 0.55s ease forwards';
  s.style.pointerEvents = 'none';
  setTimeout(function(){
    s.style.display = 'none';
    window.showLoader();
  }, 580);
}
</script>

<script>
(function(){
  // Mobile (portrait) and desktop (landscape) image sets — same 4 scenes
  var IMAGES_MOBILE = [
    '/splash/mobile_1.jpg',
    '/splash/mobile_2.jpg',
    '/splash/mobile_3.jpg',
    '/splash/mobile_4.jpg'
  ];
  var IMAGES_DESKTOP = [
    '/splash/desktop_1.jpg',
    '/splash/desktop_2.jpg',
    '/splash/desktop_3.jpg',
    '/splash/desktop_4.jpg'
  ];
  var TEXTS = [
    "Searching today's opportunities...",
    'Running the screens...',
    'Reading the market...',
    "Finding today's strongest cards..."
  ];

  // Pick the right image set for the current viewport (desktop >= 768px)
  function imageSet() {
    return (window.innerWidth >= 768) ? IMAGES_DESKTOP : IMAGES_MOBILE;
  }

  // Pick a random index across the 4 scenes
  function dailyIndex() {
    return Math.floor(Math.random() * 4);
  }

  window.showLoader = function(onDone) {
    var idx    = dailyIndex();
    var imgs   = imageSet();
    var loader = document.getElementById('loader');
    var img    = document.getElementById('loaderImg');
    var txt    = document.getElementById('loaderText');

    img.style.backgroundImage = 'url(' + imgs[idx] + ')';
    txt.textContent = TEXTS[idx];
    // Reset text animation
    txt.style.animation = 'none';
    txt.offsetHeight; // reflow
    txt.style.animation = 'loaderTextIn 1s ease 0.5s forwards';

    loader.style.display  = 'block';
    loader.style.opacity  = '1';
    loader.style.animation = 'none';

    // After 4 seconds fade out and reveal table
    setTimeout(function(){
      loader.style.animation = 'loaderFadeOut 0.7s ease forwards';
      setTimeout(function(){
        loader.style.display = 'none';
        document.getElementById('root').style.visibility = 'visible';
        if(onDone) onDone();
      }, 700);
    }, 4000);
  };
})();
</script>


<script>
(function(){
  function fit(){
    var els = document.querySelectorAll('.vjFit');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (!el.clientWidth) continue;
      if (!el.dataset.vjBase) el.dataset.vjBase = getComputedStyle(el).fontSize;
      var base = parseFloat(el.dataset.vjBase), fs = base;
      el.style.fontSize = base + 'px';
      while (el.scrollWidth > el.clientWidth + 1 && fs > base * 0.62) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
    }
  }
  var t; function soon(){ clearTimeout(t); t = setTimeout(fit, 60); }
  new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, characterData: true });
  window.addEventListener('resize', soon); window.addEventListener('load', soon);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(soon);
  soon();
})();
</script>
